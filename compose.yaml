name: vitegourmand-frontend-local

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    environment:
      # Empêche React d'essayer d'ouvrir un navigateur dans le conteneur.
      BROWSER: none
      HOST: 0.0.0.0
      PORT: 3000
      # URL appelée par le navigateur pour joindre le futur backend Docker.
      REACT_APP_API_URL: "${VG_BACKEND_URL:-http://localhost:8000}"
    ports:
      - "${VG_FRONTEND_PORT:-3000}:3000"
    volumes:
      # Le code reste éditable depuis WSL avec rechargement automatique.
      - .:/app
      # Les dépendances Linux restent isolées des fichiers Windows.
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  frontend_node_modules:
    # Volume persistant contenant les dépendances installées pour Linux.
